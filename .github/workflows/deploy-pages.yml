name: Publicar site com GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mapamental/**'
      - '.github/workflows/deploy-pages.yml'
      - 'index.html'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar site
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          test -f _site/mapamental/index.html
          test -f _site/mapamental/styles.css
          test -f _site/mapamental/app.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
